# Lint, coding-standard and unit-test checks. These do not need WordPress, Gravity Forms or TowX credentials.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dev tooling
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax lint
        run: composer lint

      - name: PHPCS (security, i18n, PHP 7.4+ compatibility)
        if: matrix.php == '8.2'
        run: composer phpcs

      - name: Unit tests
        run: composer test

      # Same script the release workflow runs: fails if the current version has no changelog section
      # (readme.txt "= x.y.z =" under == Changelog ==, or CHANGELOG.md "## [x.y.z]" not marked Unreleased).
      - name: Release notes for the current version
        if: matrix.php == '8.2'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ \* Version:[[:space:]]*//p' gravity-forms-tops.php | tr -d '\r')
          bash bin/release-notes.sh "$version" gravity-forms-tops.php "$RUNNER_TEMP/release-notes.md"
