# Builds a WordPress-ready ZIP: extracting yields wp-content/plugins/gravity-forms-tops/
# (single top-level folder named gravity-forms-tops — no version suffix).
#
# Keep the exclusion list in bin/build-zip.sh in sync when adding development-only files or directories.

name: Release ZIP

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  attach-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches plugin version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' gravity-forms-tops.php | tr -d '\r')
          constant=$(sed -n "s/^define( 'GF_TOPS_VERSION', '\(.*\)' );/\1/p" gravity-forms-tops.php | tr -d '\r')
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | tr -d '\r')
          echo "tag=$tag header=$header constant=$constant stable=$stable"
          if [ "$tag" != "$header" ] || [ "$tag" != "$constant" ] || [ "$tag" != "$stable" ]; then
            echo "::error::Tag v$tag does not match plugin header / GF_TOPS_VERSION / readme Stable tag."
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Lint and test before packaging
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          composer lint
          composer test

      - name: Create gravity-forms-tops.zip
        run: bash bin/build-zip.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: gravity-forms-tops.zip
          generate_release_notes: true
